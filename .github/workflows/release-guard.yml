name: Release guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic release guard tests
        run: npm run test:release-guard

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory bin | Out-Null

          $singBoxVersion = "1.11.8"
          $singBoxZip = "sing-box-$singBoxVersion-windows-amd64.zip"
          $singBoxUrl = "https://github.com/SagerNet/sing-box/releases/download/v$singBoxVersion/$singBoxZip"
          Invoke-WebRequest -Uri $singBoxUrl -OutFile $singBoxZip
          Expand-Archive -Force $singBoxZip -DestinationPath .sing-box
          Copy-Item ".sing-box/sing-box-$singBoxVersion-windows-amd64/sing-box.exe" "bin/sing-box.exe" -Force

          cargo build --manifest-path wbstream-multipath-aggregator/Cargo.toml --release --bin wbstream_multipath_client
          Copy-Item "wbstream-multipath-aggregator/target/release/wbstream_multipath_client.exe" "bin/wbstream_multipath_client.exe" -Force

      - name: Build Windows NSIS bundle
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
